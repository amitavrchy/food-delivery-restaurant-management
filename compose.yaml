services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tablelane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablelane_dev}
      POSTGRES_DB: tablelane
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablelane"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6381:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
volumes:
  postgres_data:
  redis_data:
